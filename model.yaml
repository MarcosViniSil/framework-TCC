experiment:
  name: "comparacao_modelos_traducao_en_pt"
  description: "Avaliação de modelos transformer para tradução Inglês-Português"
  version: "1.0"
  date: "2026-08-22"
  output_dir: "./results"

# ===== DATASET =====
dataset:
  path: "./gnome.jsonl"
  source_lang: "en"
  target_lang: "pt"
  format: "jsonl"  
  max_length: 512
  batch_size: 32
  
  fields:
    en: "en"
    pt: "pt"
    id: "id"

# ===== MODELOS =====
models:
  - id: "opus_mt-200M"
    name: "Helsinki-NLP/opus-mt-tc-big-en-pt"
    type: "encoder-decoder"  
    device: "auto"
    precision: "fp16"  
    max_length: 512
    generation_params:
      num_beams: 4
      do_sample: false
      temperature: 1.0
    
  - id: "nllb-600M"
    name: "facebook/nllb-200-distilled-600M"
    type: "encoder-decoder"
    device: "auto" 
    precision: "fp16"
    max_length: 512
    generation_params:
      num_beams: 4
      do_sample: false
      
  - id: "m2m100-418M"
    name: "facebook/m2m100_418M"
    type: "encoder-decoder"
    device: "auto"
    precision: "fp16"
    max_length: 512

# ===== MÉTRICAS DE QUALIDADE =====
quality_metrics:
  - name: "bleu"
    library: "sacrebleu"
    params:
      smooth_method: "exp"
      smooth_value: 0.0
      lowercase: true
      tokenize: "13a"
    
  - name: "chrf"
    library: "sacrebleu"  # sacrebleu também tem chrf
    params:
      char_order: 6
      word_order: 2
      lowercase: true
    
  - name: "bertscore"
    library: "bert_score"
    params:
      model_type: "bert-base-multilingual-cased"
      lang: "pt"
      rescale_with_baseline: true
      batch_size: 64
      device: "auto"
    

# ===== MÉTRICAS COMPUTACIONAIS =====
performance_metrics:
  - name: "inference_time"
    enabled: true
    warmup_batches: 3  
    measure_per_batch: true  
    
  - name: "memory_usage"
    enabled: true
    method: "psutil"  
    track_gpu: true
    track_cpu: true
    sampling_interval: 0.1  
    
  - name: "cpu_usage"
    enabled: true
    method: "psutil"
    per_core: false  
    
  - name: "gpu_utilization"
    enabled: true
    method: "pynvml" 
    track_memory: true
    track_utilization: true

# ===== REPETIÇÕES =====
executions:
  quality_runs: 1
  seed: 42
  
  performance_runs: 3  
  performance_strategy: "batch_sampling"  
  
  seeds: [42, 123, 456]  

# ===== RELATÓRIOS =====
reporting:
  plots:
    - type: "bar_chart"
      metrics: ["bleu", "chrf", "bertscore"]
      error_bars: true
      title: "Comparação de Qualidade entre Modelos"
      
    - type: "scatter"
      x_metric: "inference_time"
      y_metric: "bleu"
      title: "Trade-off: Tempo vs Qualidade"
      size_by: "memory_usage"
      
    - type: "boxplot"
      metrics: ["inference_time"]
      title: "Distribuição do Tempo de Inferência"
      
    - type: "radar" 
      metrics: ["bleu", "chrf", "bertscore", "memory_usage"]
      normalize: true
      title: "Perfil Comparativo dos Modelos"
      
  output_formats: ["pdf", "png", "html"]
  include_raw_data: true
  include_config: true