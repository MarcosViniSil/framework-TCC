experiment:
  name: "Comparison between translation models"
  description: "Evaluation of transformer models for English-Portuguese translation"
  output_dir: "./results"

dataset:
  path: "./gnome.jsonl"
  source_lang: "en"
  target_lang: "pt"
  format: "jsonl"  
  max_length: 512
  batch_size: 32
  
  fields:
    en: "en"
    pt: "pt"
    id: "id"

models:
  - id: "opus_mt-200M"
    name: "Helsinki-NLP/opus-mt-tc-big-en-pt"
    
  - id: "nllb-600M"
    name: "facebook/nllb-200-distilled-600M"

  - id: "m2m100-418M"
    name: "facebook/m2m100_418M"


quality_metrics:
  - name: "bleu"

  - name: "chrf"
    
  - name: "bertscore"

    
performance_metrics:
  - name: "inference_time"
    
  - name: "memory_usage" 
    
  - name: "cpu_usage"
    
executions:
  quality_runs: 1
  seed: 42
  
  performance_runs: 3  
  performance_strategy: "batch_sampling"  
  
  seeds: [42, 123, 456]  
